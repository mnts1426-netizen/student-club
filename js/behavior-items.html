<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة البنود - نادي وثبة الشبابي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="behavior-items.html" style="background: #2c4d96; color: white"
        >إدارة البنود</a
      >
      <a href="reports.html">التقارير</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>
      <a
        href="https://wa.me/966537466925"
        target="_blank"
        style="
          margin-top: 10px;
          background: #2c4d96;
          color: #ffcc00;
          text-align: center;
          font-weight: bold;
          border-radius: 8px;
          margin-bottom: 20px;
          padding: 10px;
          display: block;
        "
        >💬 الدعم الفني</a
      >
      <button
        id="logoutBtn"
        style="
          margin-top: auto;
          background: #dc3545;
          color: white;
          border: none;
          padding: 12px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          width: 100%;
        "
      >
        تسجيل الخروج
      </button>
    </div>

    <div class="main-content">
      <div class="card">
        <h1>إضافة بند جديد (خصم / إضافة)</h1>
        <form id="addItemForm" class="form-group">
          <div class="input-box" style="flex: 2">
            <label>اسم البند (مثال: تأخر عن الجلسة، مشاركة ممتازة)</label>
            <input
              type="text"
              id="itemName"
              required
              placeholder="اكتب وصف البند هنا..."
            />
          </div>
          <div class="input-box" style="flex: 1">
            <label>النقاط (+ للإضافة، - للخصم)</label>
            <input
              type="number"
              id="itemPoints"
              required
              placeholder="مثال: 5 أو -5"
            />
          </div>
          <button type="submit" class="btn-add">حفظ البند</button>
        </form>
      </div>

      <div class="card">
        <h2>قائمة البنود المعتمدة</h2>
        <table>
          <thead>
            <tr>
              <th>اسم البند</th>
              <th>النقاط</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="itemsBody"></tbody>
        </table>
      </div>
    </div>

    <script type="module">
      import { db, auth } from "./js/firebase-config.js";
      import {
        collection,
        addDoc,
        getDocs,
        deleteDoc,
        doc,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import {
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // الحماية وتسجيل الخروج
      onAuthStateChanged(auth, (user) => {
        if (!user) window.location.replace("login.html");
      });
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await signOut(auth);
          window.location.replace("login.html");
        });

      // الكود الأصلي الخاص بك (لم يتم لمسه)
      const itemsBody = document.getElementById("itemsBody");
      const addItemForm = document.getElementById("addItemForm");

      async function loadItems() {
        itemsBody.innerHTML = "";
        const snap = await getDocs(collection(db, "behaviorItems"));

        snap.forEach((documentSnapshot) => {
          const item = documentSnapshot.data();
          const itemId = documentSnapshot.id;
          const badgeClass =
            item.points > 0 ? "badge-positive" : "badge-negative";
          const pointsText = item.points > 0 ? `+${item.points}` : item.points;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${item.name}</td>
            <td><span class="${badgeClass}">${pointsText}</span></td>
            <td><button class="btn-delete" data-id="${itemId}">حذف</button></td>
          `;
          itemsBody.appendChild(tr);
        });

        const deleteButtons = document.querySelectorAll(".btn-delete");
        deleteButtons.forEach((button) => {
          button.addEventListener("click", async (e) => {
            const id = e.target.getAttribute("data-id");
            if (confirm("هل أنت متأكد من حذف هذا البند؟")) {
              await deleteDoc(doc(db, "behaviorItems", id));
              loadItems();
            }
          });
        });
      }

      addItemForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const itemName = document.getElementById("itemName").value;
        const itemPoints = parseInt(
          document.getElementById("itemPoints").value,
        );

        try {
          await addDoc(collection(db, "behaviorItems"), {
            name: itemName,
            points: itemPoints,
          });
          addItemForm.reset();
          loadItems();
        } catch (error) {
          console.error("خطأ في إضافة البند: ", error);
          alert("حدث خطأ أثناء حفظ البند.");
        }
      });

      loadItems();
    </script>
  </body>
</html>
