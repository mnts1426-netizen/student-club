<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>بيانات الطالب - نادي وثبة الشبابي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="behavior-items.html">إدارة البنود</a>
      <a href="reports.html">التقارير</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>
      <a href="https://wa.me/966537466925" target="_blank" style="margin-top: 10px; background: #2c4d96; color: #ffcc00; text-align: center; font-weight: bold; border-radius: 8px; margin-bottom: 20px; padding: 10px; display: block;">💬 الدعم الفني</a>
      <button id="logoutBtn" style="margin-top: auto; background: #dc3545; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;">تسجيل الخروج</button>
    </div>

    <div class="main-content">
      <div class="card" id="studentData" style="max-width: 600px; margin: auto;">
        <h1>بيانات الطالب التفصيلية</h1>
        <div id="content">جاري تحميل البيانات...</div>
      </div>
    </div>

    <script type="module">
      import { db, auth } from "./js/firebase-config.js";
      import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // الحماية وتسجيل الخروج
      onAuthStateChanged(auth, (user) => {
        if (!user) window.location.replace("login.html");
      });
      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await signOut(auth);
        window.location.replace("login.html");
      });

      // الكود الأصلي الخاص بك (لم يُمس)
      const urlParams = new URLSearchParams(window.location.search);
      const studentId = urlParams.get("id");

      async function loadStudentDetails() {
        if (!studentId)
          return (document.getElementById("content").innerText = "خطأ: لم يتم العثور على الطالب.");

        const docRef = await getDoc(doc(db, "students", studentId));
        if (docRef.exists()) {
          const s = docRef.data();
          // تم دمج التنسيقات القديمة هنا مباشرة لكي لا يتأثر التصميم
          document.getElementById("content").innerHTML = `
            <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;"><span style="color: #64748b; font-weight: bold;">الاسم:</span><span style="color: #1a2f5e; font-weight: 600;">${s.name || "---"}</span></div>
            <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;"><span style="color: #64748b; font-weight: bold;">رقم الهوية:</span><span style="color: #1a2f5e; font-weight: 600;">${s.idNumber || "---"}</span></div>
            <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;"><span style="color: #64748b; font-weight: bold;">جوال الطالب:</span><span style="color: #1a2f5e; font-weight: 600;">${s.phone || "---"}</span></div>
            <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;"><span style="color: #64748b; font-weight: bold;">بريد الطالب:</span><span style="color: #1a2f5e; font-weight: 600;">${s.email || "---"}</span></div>
            <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;"><span style="color: #64748b; font-weight: bold;">جوال ولي الأمر:</span><span style="color: #1a2f5e; font-weight: 600;">${s.parentPhone || "---"}</span></div>
            <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;"><span style="color: #64748b; font-weight: bold;">بريد ولي الأمر:</span><span style="color: #1a2f5e; font-weight: 600;">${s.parentEmail || "---"}</span></div>
            <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;"><span style="color: #64748b; font-weight: bold;">الصف الدراسي:</span><span style="color: #1a2f5e; font-weight: 600;">${s.grade || "---"}</span></div>
            <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee;"><span style="color: #64748b; font-weight: bold;">النقاط الحالية:</span><span style="color: #1a2f5e; font-weight: 600;">${s.points || 0}</span></div>
          `;
        } else {
          document.getElementById("content").innerText = "الطالب غير موجود في قاعدة البيانات.";
        }
      }
      loadStudentDetails();
    </script>
  </body>
</html>
