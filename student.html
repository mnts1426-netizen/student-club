<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة الطالب</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #f4f6f9;
        padding: 20px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .highlight {
        color: #007bff;
        font-weight: bold;
        font-size: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>مرحباً بك يا بطل</h1>

      <div class="card">
        <h3>بياناتك</h3>
        <p>نقاطك الشخصية: <span id="points" class="highlight">0</span></p>
        <p>مجموعتك: <span id="groupName" class="highlight">-</span></p>
      </div>

      <div class="card">
        <h3>رسالة اليوم لك</h3>
        <p id="dailyTip">جاري تحميل النصيحة...</p>
      </div>

      <nav>
        <a href="tasks.html">تسليم المهام</a> |
        <a href="leaderboard.html">لوحة الصدارة</a>
      </nav>
    </div>

    <script type="module">
      import { auth, db } from "./js/firebase-config.js";
      import {
        doc,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      auth.onAuthStateChanged(async (user) => {
        if (user) {
          onSnapshot(doc(db, "students", user.uid), (docSnap) => {
            const s = docSnap.data();
            document.getElementById("points").innerText = s.points || 0;
            document.getElementById("groupName").innerText =
              s.group || "لا يوجد";
            document.getElementById("dailyTip").innerText =
              s.tip || "استمر في التقدم!";
          });
        } else {
          window.location.href = "login.html";
        }
      });
    </script>
  </body>
</html>
