<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تحليل الذكاء الاصطناعي - نادي وثبة الشبابي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="behavior-items.html">إدارة البنود</a>
      <a href="reports.html">التقارير</a>
      <a href="ai-analyzer.html" style="background: #2c4d96; color: white"
        >تحليل الذكاء الاصطناعي</a
      >
      <a
        href="https://wa.me/966537466925"
        target="_blank"
        style="
          margin-top: 10px;
          background: #2c4d96;
          color: #ffcc00;
          text-align: center;
          font-weight: bold;
          border-radius: 8px;
          margin-bottom: 20px;
          padding: 10px;
          display: block;
        "
        >💬 الدعم الفني</a
      >
      <button
        id="logoutBtn"
        style="
          margin-top: auto;
          background: #dc3545;
          color: white;
          border: none;
          padding: 12px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          width: 100%;
        "
      >
        تسجيل الخروج
      </button>
    </div>

    <div class="main-content">
      <div class="card admin-panel">
        <h3>إدارة نقاط الطالب (للمشرفين)</h3>
        <select id="reasonSelect" onchange="checkCustomReason()">
          <option value="مشاركة فعالة,100">مشاركة فعالة (+100)</option>
          <option value="تنظيم النادي,50">تنظيم النادي (+50)</option>
          <option value="تأخر عن الموعد,-20">تأخر عن الموعد (-20)</option>
          <option value="custom">سبب آخر (مخصص)...</option>
        </select>
        <div
          id="customFields"
          style="display: none; gap: 10px; margin-top: 10px"
        >
          <input
            type="text"
            id="customReason"
            placeholder="اكتب السبب هنا"
            style="flex: 2"
          />
          <input
            type="number"
            id="customPoints"
            placeholder="عدد النقاط"
            style="flex: 1"
          />
        </div>
        <button
          onclick="submitPoints()"
          style="
            background: #764ba2;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
          "
        >
          تنفيذ العملية
        </button>
      </div>

      <div class="card">
        <h3>سجل الحركة (المنح والخصم)</h3>
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>النوع</th>
              <th>القيمة</th>
              <th>السبب</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>

    <script type="module">
      import { db, auth } from "./js/firebase-config.js";
      import {
        collection,
        addDoc,
        query,
        where,
        orderBy,
        getDocs,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import {
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // الحماية وتسجيل الخروج
      onAuthStateChanged(auth, (user) => {
        if (!user) window.location.replace("login.html");
      });
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await signOut(auth);
          window.location.replace("login.html");
        });

      // الكود الأصلي الخاص بك (لم يتم لمسه)
      window.checkCustomReason = () => {
        document.getElementById("customFields").style.display =
          document.getElementById("reasonSelect").value === "custom"
            ? "flex"
            : "none";
      };

      window.submitPoints = async () => {
        let val = document.getElementById("reasonSelect").value;
        let reason, amount;

        if (val === "custom") {
          reason = document.getElementById("customReason").value;
          amount = parseInt(document.getElementById("customPoints").value);
        } else {
          [reason, amount] = val.split(",");
          amount = parseInt(amount);
        }

        await addDoc(collection(db, "points_logs"), {
          studentId: "CURRENT_STUDENT_ID", // سيتم جلبه ديناميكياً
          reason: reason,
          amount: amount,
          type: amount >= 0 ? "منح" : "خصم",
          timestamp: serverTimestamp(),
        });
        location.reload();
      };
    </script>
  </body>
</html>
