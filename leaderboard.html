<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>لوحة الصدارة - نادي وثبة الشبابي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html" style="background: #2c4d96; color: white"
        >لوحات الصدارة</a
      >
      <a href="behavior-items.html">إدارة البنود</a>
      <a href="reports.html">التقارير</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>
      <a
        href="https://wa.me/966537466925"
        target="_blank"
        style="
          margin-top: 10px;
          background: #2c4d96;
          color: #ffcc00;
          text-align: center;
          font-weight: bold;
          border-radius: 8px;
          margin-bottom: 20px;
          padding: 10px;
          display: block;
        "
        >💬 الدعم الفني</a
      >
      <button
        id="logoutBtn"
        style="
          margin-top: auto;
          background: #dc3545;
          color: white;
          border: none;
          padding: 12px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          width: 100%;
        "
      >
        تسجيل الخروج
      </button>
    </div>

    <div class="main-content">
      <h1>🏆 لوحة الصدارة والتميز</h1>
      <div class="container" style="display: flex; gap: 20px; flex-wrap: wrap">
        <div class="card" style="flex: 1; min-width: 350px">
          <h2 style="color: #1a2f5e">🥇 النخبة (أفضل الطلاب)</h2>
          <div id="topStudents"></div>
        </div>

        <div class="card" style="flex: 1; min-width: 350px">
          <h2 style="color: #1a2f5e">👥 ترتيب المجموعات</h2>
          <div id="topGroups"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import { db, auth } from "./js/firebase-config.js";
      import {
        collection,
        query,
        orderBy,
        limit,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import {
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // الحماية وتسجيل الخروج
      onAuthStateChanged(auth, (user) => {
        if (!user) window.location.replace("login.html");
      });
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await signOut(auth);
          window.location.replace("login.html");
        });

      // الكود الأصلي الخاص بك (لم يُمس)
      function renderRow(name, score, rank, id = null) {
        const nameContent = id
          ? `<a href="student-details.html?id=${id}" style="text-decoration:none; color:#333;">${name}</a>`
          : name;
        return `<div style="display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0;">
                  <div style="width: 40px; height: 40px; background: #eef2ff; color: #1a2f5e; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-left: 15px;">${rank}</div>
                  <div style="flex: 1; font-weight: 600; color: #333;">${nameContent}</div>
                  <div style="background: #dcfce7; color: #166534; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em;">${score} نقطة</div>
                </div>`;
      }

      onSnapshot(
        query(collection(db, "students"), orderBy("points", "desc"), limit(10)),
        (snap) => {
          let html = "";
          let i = 1;
          snap.forEach((doc) => {
            html += renderRow(
              doc.data().name || "طالب",
              doc.data().points || 0,
              i++,
              doc.id,
            );
          });
          document.getElementById("topStudents").innerHTML = html;
        },
      );

      onSnapshot(collection(db, "students"), (snap) => {
        const groups = {};
        snap.forEach((d) => {
          groups[d.data().group] =
            (groups[d.data().group] || 0) + (d.data().points || 0);
        });
        let html = "";
        Object.entries(groups)
          .sort((a, b) => b[1] - a[1])
          .forEach(([name, pts], i) => {
            html += renderRow(name || "مجموعة", pts, i + 1);
          });
        document.getElementById("topGroups").innerHTML = html;
      });
    </script>
  </body>
</html>
