<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>لوحة الصدارة - نادي وثبة الشبابي</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        display: flex;
        min-height: 100vh;
      }

      /* القائمة الجانبية الموحدة */
      .sidebar {
        width: 260px;
        background: #1a2f5e;
        color: white;
        padding: 20px;
        flex-shrink: 0;
      }
      .sidebar h2 {
        font-size: 18px;
        text-align: center;
        margin-bottom: 30px;
      }
      .sidebar a {
        display: block;
        color: #d1d9e6;
        padding: 15px;
        text-decoration: none;
        border-bottom: 1px solid #2c4d96;
        transition: 0.3s;
      }
      .sidebar a:hover {
        background: #2c4d96;
        color: white;
      }

      .main-content {
        flex: 1;
        padding: 30px;
      }
      .container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        flex: 1;
        min-width: 350px;
      }
      h1 {
        color: #1a2f5e;
        margin-bottom: 25px;
      }
      h2 {
        color: #1a2f5e;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .rank-row {
        display: flex;
        align-items: center;
        padding: 15px;
        border-bottom: 1px solid #f0f0f0;
        transition: 0.3s;
      }
      .rank-row:hover {
        background: #fdfdfd;
        transform: translateX(-5px);
      }
      .rank-number {
        width: 40px;
        height: 40px;
        background: #eef2ff;
        color: #1a2f5e;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin-left: 15px;
      }
      .name {
        flex: 1;
        font-weight: 600;
        color: #333;
      }
      .points {
        background: #dcfce7;
        color: #166534;
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>
      <a
        href="https://wa.me/9665XXXXXXXX"
        target="_blank"
        style="color: #ffcc00; margin-top: 20px"
        >💬 الدعم الفني</a
      >
    </div>

    <div class="main-content">
      <h1>🏆 لوحة الصدارة والتميز</h1>
      <div class="container">
        <div class="card">
          <h2>🥇 النخبة (أفضل الطلاب)</h2>
          <div id="topStudents"></div>
        </div>

        <div class="card">
          <h2>👥 ترتيب المجموعات</h2>
          <div id="topGroups"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import { db } from "./js/firebase-config.js";
      import {
        collection,
        query,
        orderBy,
        limit,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // دالة لتوليد الصفوف مع ربط الاسم بصفحة التفاصيل
      function renderRow(name, score, rank, id = null) {
        const nameContent = id
          ? `<a href="student-details.html?id=${id}" style="text-decoration:none; color:#333;">${name}</a>`
          : name;
        return `<div class="rank-row">
                  <div class="rank-number">${rank}</div>
                  <div class="name">${nameContent}</div>
                  <div class="points">${score} نقطة</div>
                </div>`;
      }

      // جلب الطلاب
      onSnapshot(
        query(collection(db, "students"), orderBy("points", "desc"), limit(10)),
        (snap) => {
          let html = "";
          let i = 1;
          snap.forEach((doc) => {
            html += renderRow(
              doc.data().name || "طالب",
              doc.data().points || 0,
              i++,
              doc.id, // تمرير معرف الطالب للرابط
            );
          });
          document.getElementById("topStudents").innerHTML = html;
        },
      );

      // جلب المجموعات
      onSnapshot(collection(db, "students"), (snap) => {
        const groups = {};
        snap.forEach((d) => {
          groups[d.data().group] =
            (groups[d.data().group] || 0) + (d.data().points || 0);
        });
        let html = "";
        Object.entries(groups)
          .sort((a, b) => b[1] - a[1])
          .forEach(([name, pts], i) => {
            html += renderRow(name || "مجموعة", pts, i + 1);
          });
        document.getElementById("topGroups").innerHTML = html;
      });
    </script>
  </body>
</html>
