<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تحضير الطلاب - نادي وثبة الشبابي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html" style="background: #2c4d96; color: white"
        >تحضير الطلاب</a
      >
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="behavior-items.html">إدارة البنود</a>
      <a href="reports.html">التقارير</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>
      <a
        href="https://wa.me/966537466925"
        target="_blank"
        style="
          margin-top: 10px;
          background: #2c4d96;
          color: #ffcc00;
          text-align: center;
          font-weight: bold;
          border-radius: 8px;
          margin-bottom: 20px;
          padding: 10px;
          display: block;
        "
        >💬 الدعم الفني</a
      >
      <button
        id="logoutBtn"
        style="
          margin-top: auto;
          background: #dc3545;
          color: white;
          border: none;
          padding: 12px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          width: 100%;
        "
      >
        تسجيل الخروج
      </button>
    </div>

    <div class="main-content">
      <div class="card">
        <div class="header-box">
          <h1>تحضير الطلاب اليومي</h1>
          <div
            style="
              background: #eef2ff;
              padding: 10px;
              border-radius: 8px;
              font-weight: bold;
            "
          >
            التاريخ: 1448/1/7 هـ
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>اسم الطالب</th>
              <th>نوع الاشتراك</th>
              <th>حالة الحضور</th>
              <th>وقت التحضير</th>
            </tr>
          </thead>
          <tbody id="attendanceBody"></tbody>
        </table>

        <div class="actions">
          <button class="btn save-btn">حفظ كشف الحضور</button>
          <button class="btn print-btn" onclick="window.print()">
            طباعة التقرير
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      // تم إضافة auth لتشغيل تسجيل الخروج
      import { db, auth } from "./js/firebase-config.js";
      import {
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import {
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // الحماية وتسجيل الخروج
      onAuthStateChanged(auth, (user) => {
        if (!user) window.location.replace("login.html");
      });
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await signOut(auth);
          window.location.replace("login.html");
        });

      // الكود الأصلي الخاص بك (لم يتم لمسه)
      const tbody = document.getElementById("attendanceBody");

      async function loadStudents() {
        const snap = await getDocs(collection(db, "students"));
        snap.forEach((doc) => {
          const s = doc.data();
          const studentId = doc.id;
          tbody.innerHTML += `
            <tr>
              <td><a href="student-details.html?id=${studentId}" style="text-decoration:none; color:#1a2f5e; font-weight:bold;">${s.name}</a></td>
              <td>${s.subscriptionType || "لم يحدد"}</td>
              <td>
                <select id="attendanceStatus" onchange="this.style.color = this.options[this.selectedIndex].style.color">
                  <option value="present" style="color: green;">حاضر</option>
                  <option value="absent" style="color: red;">غائب</option>
                  <option value="late" style="color: orange;">متأخر</option>
                  <option value="excused" style="color: #1a73e8;">مستأذن</option>
                </select>
              </td>
              <td><small>${new Date().toLocaleTimeString("ar-SA")}</small></td>
            </tr>`;
        });
      }
      loadStudents();
    </script>
  </body>
</html>
