<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تحضير الطلاب - نادي وثبة الشبابي</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        display: flex;
        min-height: 100vh;
      }

      /* القائمة الجانبية */
      .sidebar {
        width: 260px;
        background: #1a2f5e;
        color: white;
        padding: 20px;
        flex-shrink: 0;
      }
      .sidebar h2 {
        font-size: 18px;
        text-align: center;
        margin-bottom: 30px;
      }
      .sidebar a {
        display: block;
        color: #d1d9e6;
        padding: 15px;
        text-decoration: none;
        border-bottom: 1px solid #2c4d96;
        transition: 0.3s;
      }
      .sidebar a:hover {
        background: #2c4d96;
        color: white;
      }

      /* المحتوى */
      .main-content {
        flex: 1;
        padding: 30px;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .header-box {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: center;
      }
      select {
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ddd;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        color: white;
      }
      .save-btn {
        background: #25d366;
      }
      .print-btn {
        background: #1a2f5e;
      }

      @media print {
        .sidebar,
        .actions,
        select {
          display: none !important;
        }
        .main-content {
          padding: 0;
        }
        .card {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>
      <a
        href="https://wa.me/9665XXXXXXXX"
        target="_blank"
        style="color: #ffcc00; margin-top: 20px"
        >💬 الدعم الفني</a
      >
    </div>

    <div class="main-content">
      <div class="card">
        <div class="header-box">
          <h1>تحضير الطلاب اليومي</h1>
          <div
            style="
              background: #eef2ff;
              padding: 10px;
              border-radius: 8px;
              font-weight: bold;
            "
          >
            التاريخ: 1448/1/7 هـ
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>اسم الطالب</th>
              <th>نوع الاشتراك</th>
              <th>حالة الحضور</th>
              <th>وقت التحضير</th>
            </tr>
          </thead>
          <tbody id="attendanceBody"></tbody>
        </table>

        <div class="actions">
          <button class="btn save-btn">حفظ كشف الحضور</button>
          <button class="btn print-btn" onclick="window.print()">
            طباعة التقرير
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import { db } from "./js/firebase-config.js";
      import {
        collection,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const tbody = document.getElementById("attendanceBody");

      async function loadStudents() {
        const snap = await getDocs(collection(db, "students"));
        snap.forEach((doc) => {
          const s = doc.data();
          const studentId = doc.id; // الحصول على معرف الطالب
          tbody.innerHTML += `
            <tr>
              <td><a href="student-details.html?id=${studentId}" style="text-decoration:none; color:#1a2f5e; font-weight:bold;">${s.name}</a></td>
              <td>${s.subscriptionType || "لم يحدد"}</td>
              <td>
                <select>
                  <option value="present">حاضر</option>
                  <option value="absent">غائب</option>
                  <option value="late">متأخر</option>
                  <option value="excused">مستأذن</option>
                </select>
              </td>
              <td><small>${new Date().toLocaleTimeString("ar-SA")}</small></td>
            </tr>`;
        });
      }
      loadStudents();
    </script>
  </body>
</html>
