<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم المشرف - نادي وثبة الشبابي</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        display: flex;
        min-height: 100vh;
      }

      /* القائمة الجانبية */
      .sidebar {
        width: 260px;
        background: #1a2f5e;
        color: white;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }
      .sidebar h2 {
        font-size: 20px;
        text-align: center;
        margin-bottom: 30px;
      }
      .sidebar a {
        display: block;
        color: #d1d9e6;
        padding: 15px;
        text-decoration: none;
        border-bottom: 1px solid #2c4d96;
        transition: 0.3s;
      }
      .sidebar a:hover {
        background: #2c4d96;
        color: white;
      }
      /* تنسيق رابط الدعم الفني */
      .support-link {
        margin-top: 10px;
        background: #2c4d96;
        color: #ffcc00 !important;
        text-align: center;
        font-weight: bold;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .logout-btn {
        margin-top: auto;
        background: #cc0000;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }

      /* المحتوى الرئيسي */
      .main-content {
        flex: 1;
        padding: 30px;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      h1 {
        color: #1a2f5e;
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th {
        background-color: #f8f9fa;
        padding: 15px;
        text-align: center;
        border-bottom: 2px solid #dee2e6;
        color: #495057;
      }
      td {
        padding: 15px;
        border-bottom: 1px solid #eee;
        text-align: center;
      }

      .btn {
        padding: 8px 12px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        margin: 2px;
      }
      .btn-add {
        background-color: #25d366;
        color: white;
      }
      .btn-deduct {
        background-color: #cc0000;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>

      <a
        href="https://wa.me/9665XXXXXXXX?text=مرحباً، أحتاج مساعدة في نظام نادي وثبة"
        target="_blank"
        class="support-link"
        >💬 الدعم الفني</a
      >

      <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <div class="main-content">
      <div class="card">
        <h1>لوحة تحكم المشرف</h1>
        <h3>قائمة المشتركين</h3>
        <table>
          <thead>
            <tr>
              <th>اسم الطالب</th>
              <th>المجموعة</th>
              <th>النقاط</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="studentsTable"></tbody>
        </table>
      </div>
    </div>

    <script type="module">
      import { db } from "./js/firebase-config.js";
      import {
        collection,
        onSnapshot,
        doc,
        updateDoc,
        increment,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const tableBody = document.getElementById("studentsTable");

      onSnapshot(collection(db, "students"), (snapshot) => {
        tableBody.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const s = docSnap.data();
          const row = `<tr>
              <td>${s.name || "غير معروف"}</td>
              <td>${s.group || "-"}</td>
              <td><strong>${s.points || 0}</strong></td>
              <td>
                  <button class="btn btn-add" onclick="updatePoints('${docSnap.id}', 5)">+5</button>
                  <button class="btn btn-deduct" onclick="updatePoints('${docSnap.id}', -5)">-5</button>
              </td>
          </tr>`;
          tableBody.innerHTML += row;
        });
      });

      window.updatePoints = async (id, amount) => {
        await updateDoc(doc(db, "students", id), {
          points: increment(amount),
        });
      };

      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
