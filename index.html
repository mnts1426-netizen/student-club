<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم المشرف - نادي وثبة الشبابي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html" style="background: #2c4d96; color: white"
        >لوحة التحكم</a
      >
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html">المهام والمشاريع</a>
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="behavior-items.html">إدارة البنود</a>
      <a href="reports.html">التقارير</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>

      <a
        href="https://wa.me/9665XXXXXXXX?text=مرحباً، أحتاج مساعدة في نظام نادي وثبة"
        target="_blank"
        style="
          margin-top: 10px;
          background: #2c4d96;
          color: #ffcc00;
          text-align: center;
          font-weight: bold;
          border-radius: 8px;
          margin-bottom: 20px;
          padding: 10px;
          display: block;
        "
        >💬 الدعم الفني</a
      >

      <button
        id="logoutBtn"
        style="
          margin-top: auto;
          background: #dc3545;
          color: white;
          border: none;
          padding: 12px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          width: 100%;
        "
      >
        تسجيل الخروج
      </button>
    </div>

    <div class="main-content">
      <div class="card">
        <h1>لوحة تحكم المشرف</h1>
        <h3>قائمة المشتركين</h3>
        <table>
          <thead>
            <tr>
              <th>اسم الطالب</th>
              <th>المجموعة</th>
              <th>النقاط</th>
              <th>الإجراءات السريعة</th>
            </tr>
          </thead>
          <tbody id="studentsTable"></tbody>
        </table>
      </div>
    </div>

    <script type="module">
      // 1. استيراد خدمات قاعدة البيانات والمصادقة
      import { db, auth } from "./js/firebase-config.js";
      import {
        collection,
        onSnapshot,
        doc,
        updateDoc,
        increment,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import {
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      // ==========================================
      // نظام الحماية (Auth Guard)
      // ==========================================
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          // إذا لم يكن هناك مستخدم مسجل الدخول، اطرده لصفحة الدخول فوراً
          window.location.replace("login.html");
        }
      });

      // ==========================================
      // جلب بيانات الطلاب وعرضها
      // ==========================================
      const tableBody = document.getElementById("studentsTable");

      onSnapshot(collection(db, "students"), (snapshot) => {
        tableBody.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const s = docSnap.data();
          const row = `<tr>
              <td><a href="student-details.html?id=${docSnap.id}" style="text-decoration:none; color:#1a2f5e; font-weight:bold;">${s.name || "غير معروف"}</a></td>
              <td>${s.group || "-"}</td>
              <td><strong>${s.points || s.totalPoints || 0}</strong></td>
              <td>
                  <button class="btn btn-add" onclick="updatePoints('${docSnap.id}', 5)">+5</button>
                  <button class="btn btn-deduct" onclick="updatePoints('${docSnap.id}', -5)">-5</button>
              </td>
          </tr>`;
          tableBody.innerHTML += row;
        });
      });

      // دالة الإضافة والخصم السريع من الجدول
      window.updatePoints = async (id, amount) => {
        await updateDoc(doc(db, "students", id), {
          totalPoints: increment(amount), // تم توحيد اسم المتغير ليطابق صفحة تفاصيل الطالب
        });
      };

      // ==========================================
      // تسجيل الخروج الحقيقي (Sign Out)
      // ==========================================
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          try {
            await signOut(auth); // إغلاق الجلسة في سيرفرات فايربيس
            window.location.replace("login.html"); // التوجيه لصفحة الدخول
          } catch (error) {
            console.error("حدث خطأ أثناء تسجيل الخروج:", error);
            alert("تعذر تسجيل الخروج، حاول مرة أخرى.");
          }
        });
    </script>
  </body>
</html>
