<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>المهام والمشاريع - نادي وثبة الشبابي</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>
      <a href="index.html">لوحة التحكم</a>
      <a href="attendance.html">تحضير الطلاب</a>
      <a href="tasks.html" style="background: #2c4d96; color: white"
        >المهام والمشاريع</a
      >
      <a href="leaderboard.html">لوحات الصدارة</a>
      <a href="behavior-items.html">إدارة البنود</a>
      <a href="reports.html">التقارير</a>
      <a href="ai-analyzer.html">تحليل الذكاء الاصطناعي</a>
      <a
        href="https://wa.me/966537466925"
        target="_blank"
        style="
          margin-top: 10px;
          background: #2c4d96;
          color: #ffcc00;
          text-align: center;
          font-weight: bold;
          border-radius: 8px;
          margin-bottom: 20px;
          padding: 10px;
          display: block;
        "
        >💬 الدعم الفني</a
      >
      <button
        id="logoutBtn"
        style="
          margin-top: auto;
          background: #dc3545;
          color: white;
          border: none;
          padding: 12px;
          border-radius: 8px;
          cursor: pointer;
          font-weight: bold;
          width: 100%;
        "
      >
        تسجيل الخروج
      </button>
    </div>

    <div class="main-content">
      <div class="card">
        <h1>المهام والمشاريع</h1>
        <div id="tasksContainer">
          <div
            style="
              padding: 15px;
              border-bottom: 1px solid #eee;
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <span>مشروع برمجة الموقع</span>
            <span class="badge-positive">نشط</span>
          </div>
          <div
            style="
              padding: 15px;
              border-bottom: 1px solid #eee;
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <span>تصميم الهوية البصرية</span>
            <span class="badge-negative">غير مكتمل</span>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { auth } from "./js/firebase-config.js";
      import {
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      onAuthStateChanged(auth, (user) => {
        if (!user) window.location.replace("login.html");
      });
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await signOut(auth);
          window.location.replace("login.html");
        });
    </script>
  </body>
</html>
