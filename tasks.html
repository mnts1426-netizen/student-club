<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>المهام والمشاريع - نادي وثبة الشبابي</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        display: flex;
        min-height: 100vh;
      }

      /* القائمة الجانبية الموحدة */
      .sidebar {
        width: 260px;
        background: #1a2f5e;
        color: white;
        padding: 20px;
      }
      .sidebar a {
        display: block;
        color: #d1d9e6;
        padding: 15px;
        text-decoration: none;
        border-bottom: 1px solid #2c4d96;
      }
      .sidebar a:hover {
        background: #2c4d96;
        color: white;
      }

      .main-content {
        flex: 1;
        padding: 30px;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #1a2f5e;
      }
      .task-item {
        padding: 15px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .status-badge {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85em;
      }
      .status-active {
        background: #dcfce7;
        color: #166534;
      }
      .status-inactive {
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>إدارة نادي وثبة الشبابي</h2>

        target="_blank"
        style="color: #ffcc00; margin-top: 10px"
        >💬 الدعم الفني</a
      >
    </div>

    <div class="main-content">
      <div class="card">
        <h1>المهام والمشاريع</h1>
        <div id="tasksContainer">
          <div class="task-item">
            <span>مشروع برمجة الموقع</span>
            <span class="status-badge status-active">نشط</span>
          </div>
          <div class="task-item">
            <span>تصميم الهوية البصرية</span>
            <span class="status-badge status-inactive">غير مكتمل</span>
